name: Bug Report
description: Report unexpected platform behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run ...
        2. Apply ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add relevant logs, error messages, or screenshots.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Example: local / kind"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context